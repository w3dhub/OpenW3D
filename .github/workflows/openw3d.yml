name: openw3d

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WINDOWS_VCPKG_VERSION: 20261004-174006

jobs:
  job:
    name: ${{ matrix.name }} Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 38
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86
            os: windows-latest
            cmake-args: -GNinja -DCMAKE_BUILD_TYPE=Release
            shell: pwsh
            arch: x86
            options: "/W4;/WX"
          - name: MSVC x64
            os: windows-latest
            cmake-args: -GNinja -DCMAKE_BUILD_TYPE=Release
            shell: pwsh
            arch: x64
            options: "/W4;/WX"
            vcpkg: true
          - name: MinGW x64
            os: windows-latest
            cmake-args: -DW3D_BUILD_OPTION_FFMPEG=ON -GNinja -DCMAKE_BUILD_TYPE=Release
            build-args: --target combat combate renegade renegadeserver ww3d2e wwaudioe wwphyse
            msys2: true
            msys2-msystem: mingw64
            msys2-env: mingw-w64-x86_64
            shell: msys2 {0}
          - name: MinGW clang x64
            os: windows-latest
            cmake-args: -DW3D_BUILD_OPTION_FFMPEG=ON -GNinja -DCMAKE_BUILD_TYPE=Release
            build-args: --target combat combate renegade renegadeserver ww3d2e wwaudioe wwphyse
            msys2: true
            msys2-msystem: clang64
            msys2-env: mingw-w64-clang-x86_64
            shell: msys2 {0}
          - name: MinGW x64 SDL3
            os: windows-latest
            cmake-args: -DW3D_BUILD_OPTION_SDL3=ON -DW3D_BUILD_OPTION_FFMPEG=ON -GNinja -DCMAKE_BUILD_TYPE=Release
            build-args: --target combat combate renegade renegadeserver ww3d2e wwaudioe wwphyse
            sdl3: true
            msys2: true
            msys2-msystem: mingw64
            msys2-env: mingw-w64-x86_64
            shell: msys2 {0}
          - name: Linux x64
            os: ubuntu-latest
            sdl3: true
            linux: true
            build-args: >
               --parallel
               --target
               scripts
               bandtest
               scontrol
               wwsaveload
               wwmath
               wwutil
               wwdebug
               wwbitpack
               wwtranslatedb
            shell: bash

    steps:

    - uses: actions/checkout@v6
    - name: 'Set up MSYS2'
      if: ${{ !!matrix.msys2 }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msys2-msystem }}
        install: >-
          ${{ matrix.msys2-env }}-cc
          ${{ matrix.msys2-env }}-cmake
          ${{ matrix.msys2-env }}-ffmpeg
          ${{ matrix.msys2-env }}-ninja
          ${{ matrix.msys2-env }}-pkg-config
    - name: 'Set up MSVC dev cmd'
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: ${{ matrix.arch }}

    - name: Download vcpkg cache
      if: ${{ !!matrix.vcpkg }}
      uses: ethanjli/cached-download-action@v0.1.2
      with:
          url: https://dependencies.rm5248.com/windows-vcpkg-export-${{env.WINDOWS_VCPKG_VERSION}}.zip 
          destination: ${{github.workspace}}/vcpkg.zip
    - name: Extract vcpkg
      if: ${{ !!matrix.vcpkg }}
      run: 7z x vcpkg.zip

    - uses: libsdl-org/setup-sdl@main
      if: ${{ !!matrix.sdl3 }}
      id: sdl
      with:
        install-linux-dependencies: true
        add-to-environment: true
        version: 3-latest
        cmake-generator: Ninja
        shell: ${{ matrix.shell }}
    - name: 'Set up DXVK for Linux'
      if: ${{ !!matrix.linux }}
      run: |
        sudo apt update -qq > /dev/null
        sudo apt install -qq libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libopenal-dev libfreetype-dev > /dev/null
        wget --no-verbose \
          -O /tmp/dxvk-native.tar.gz \
          "https://github.com/doitsujin/dxvk/releases/download/v2.7.1/dxvk-native-2.7.1-steamrt-sniper.tar.gz"

        sudo tar -xvf /tmp/dxvk-native.tar.gz -C /
    - name: 'CMake (configure)'
      if: ${{ !matrix.vcpkg }}
      env:
        W3D_COMPILER_FLAGS:  ${{ matrix.options }}
      run: >- 
        cmake -S . -B build ${{ matrix.cmake-args }}
    - name: 'check files'
      shell: pwsh
      run: |
        Get-ChildItem -Recurse -File
    - name: 'CMake (vcpkg)'
      if: ${{ !!matrix.vcpkg }}
      env:
        W3D_COMPILER_FLAGS:  ${{ matrix.options }}
      run: >- 
        cmake -S . -B build ${{ matrix.cmake-args }}
        -DW3D_BUILD_QT_TOOLS=ON
        -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg-export-${{env.WINDOWS_VCPKG_VERSION}}/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_EXPORT=vcpkg-export-${{env.WINDOWS_VCPKG_VERSION}} -DVCPKG_ROOT=${{github.workspace}}/vcpkg-export-${{env.WINDOWS_VCPKG_VERSION}}
        -DVCPKG_MANIFEST_DIR=""
    - name: 'Message loop tests'
      run: |
        cmake --build build --target wwlib_msgloop_tests
        ctest --test-dir build --output-on-failure -R '^wwlib_msgloop_tests$'
    - name: 'CMake (build)'
      run: |
        cmake --build build --parallel ${{ matrix.build-args }}

    - name: Create windows zip
      if: ${{ !!matrix.vcpkg }}
      shell: pwsh
      run: |
        mkdir ./build/openw3d
        mkdir ./build/dummy-folder
        cp ./build/*.dll ./build/openw3d
        cp ./build/*.exe ./build/openw3d
        cp -r ./build/generic ./build/openw3d
        cp -r ./build/iconengines ./build/openw3d
        cp -r ./build/imageformats ./build/openw3d
        cp -r ./build/networkinformation ./build/openw3d
        cp -r ./build/platforms ./build/openw3d
        cp -r ./build/styles ./build/openw3d
        cp -r ./build/tls ./build/openw3d
        cd build
        7z a openw3d.zip openw3d

    - name: Archive binaries
      uses: actions/upload-artifact@v4
      with:
        name: openw3d
        path: |
          build/openw3d/*
          build/dummy-folder/
